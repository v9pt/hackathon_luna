services:
  - type: web
    name: task03-agent-backend
    env: python
    rootDir: task03-agent/backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: GEMINI_API_KEY
        sync: false
      - key: CORS_ORIGINS
        value: http://localhost:3000,http://localhost:5173

  - type: static
    name: task03-agent-frontend
    rootDir: task03-agent/frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://task03-agent-backend.onrender.com
